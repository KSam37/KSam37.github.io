<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="580" viewBox="0 0 1440 580">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6c7079"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ecebe7"/></marker>
    <marker id="am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#a7aab1"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff6a2b"/></marker>
    <style>
      .t { font-family: Marcellus; font-size: 25px; fill: #ecebe7; text-anchor: middle; }
      .lab { font-family: Consolas; font-size: 15px; letter-spacing: 2px; text-anchor: middle; }
      .d { font-family: 'Segoe UI'; font-size: 16px; fill: #a7aab1; text-anchor: middle; }
      .n { fill: #111216; stroke: rgba(255,255,255,.22); stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1440" height="580" fill="#0b0c0e"/>

  <!-- cross-review boundary: the pair under third-party review -->
  <rect x="372" y="46" width="316" height="396" rx="22" fill="none" stroke="#a7aab1" stroke-width="1.5" stroke-dasharray="7 6"/>

  <!-- top row: Second AI Model, Physics Models, Reusable Toolkit; FEA sits under the toolkit, above CAD -->
  <rect x="60" y="74" width="220" height="84" rx="42" fill="#0b0c0e" stroke="#a7aab1" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text class="t" x="170" y="125">Second AI Model</text>
  <path d="M290 116 H362" fill="none" stroke="#a7aab1" stroke-width="1.8" stroke-dasharray="7 6" marker-start="url(#am)" marker-end="url(#am)"/>
  <text class="lab" x="170" y="198" fill="#a7aab1">CROSS-REVIEW LOOP</text>
  <text class="d" x="170" y="222">independent verification,</text>
  <text class="d" x="170" y="244">run on request</text>

  <rect class="n" x="400" y="74" width="260" height="84" rx="12"/>
  <text class="t" x="530" y="125">Physics Models</text>

  <rect class="n" x="740" y="74" width="220" height="84" rx="12"/>
  <text class="t" x="850" y="125">Reusable Toolkit</text>
  <path d="M670 116 H730" fill="none" stroke="#6c7079" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>

  <rect class="n" x="760" y="200" width="180" height="72" rx="12"/>
  <text class="t" x="850" y="245">FEA</text>

  <!-- model loop -->
  <path d="M470 166 V320" fill="none" stroke="#ecebe7" stroke-width="2" marker-end="url(#aw)"/>
  <path d="M590 322 V168" fill="none" stroke="#ecebe7" stroke-width="2" marker-end="url(#aw)"/>
  <text class="lab" x="531" y="240" fill="#ecebe7">MODEL</text>
  <text class="lab" x="531" y="262" fill="#ecebe7">LOOP</text>

  <!-- FEA loop: a side loop of CAD -->
  <path d="M880 280 V320" fill="none" stroke="#ecebe7" stroke-width="2" marker-end="url(#aw)"/>
  <path d="M820 322 V282" fill="none" stroke="#ecebe7" stroke-width="2" marker-end="url(#aw)"/>

  <!-- main row -->
  <rect class="n" x="60" y="330" width="220" height="84" rx="12"/>
  <text class="t" x="170" y="381">Requirements</text>

  <rect x="400" y="330" width="260" height="84" rx="12" fill="rgba(255,106,43,.12)" stroke="#ff6a2b" stroke-width="2"/>
  <text class="t" x="530" y="381">Design Specification</text>

  <rect class="n" x="760" y="330" width="180" height="84" rx="12"/>
  <text class="t" x="850" y="381">CAD</text>
  <rect class="n" x="980" y="330" width="180" height="84" rx="12"/>
  <text class="t" x="1070" y="381">Prototype</text>
  <rect class="n" x="1200" y="330" width="180" height="84" rx="12"/>
  <text class="t" x="1290" y="381">Test Data</text>

  <g stroke="#6c7079" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M288 372 H390"/><path d="M670 372 H750"/><path d="M948 372 H970"/><path d="M1168 372 H1190"/>
  </g>

  <!-- hardware loop -->
  <path d="M1290 422 V456 a18 18 0 0 1 -18 18 H548 a18 18 0 0 1 -18 -18 V424" fill="none" stroke="#ff6a2b" stroke-width="2.5" marker-end="url(#ao)"/>
  <text class="lab" x="910" y="512" fill="#ff6a2b">HARDWARE LOOP</text>
  <text class="d" x="910" y="538">measurements replace estimates and recalibrate the models</text>
</svg>
