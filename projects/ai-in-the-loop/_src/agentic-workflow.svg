<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6c7079"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ecebe7"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#ff6a2b"/></marker>
    <style>
      .t { font-family: Marcellus; font-size: 24px; fill: #ecebe7; text-anchor: middle; }
      .tag { font-family: Consolas; font-size: 13px; fill: #8a8e97; text-anchor: middle; letter-spacing: .4px; }
      .lab { font-family: Consolas; font-size: 14px; letter-spacing: 2px; fill: #6c7079; text-anchor: middle; }
      .e { font-family: 'Segoe UI'; font-size: 14px; fill: #a7aab1; }
      .n { fill: #111216; stroke: rgba(255,255,255,.22); stroke-width: 1.5; }
      .nd { fill: #0e0f12; stroke: rgba(255,255,255,.3); stroke-width: 1.5; stroke-dasharray: 7 6; }
      .l { stroke: #6c7079; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  <rect width="1600" height="820" fill="#0b0c0e"/>

  <!-- engineer -->
  <rect x="540" y="44" width="520" height="92" rx="46" fill="#111216" stroke="#ecebe7" stroke-width="1.8"/>
  <text class="t" x="800" y="86">The Engineer</text>
  <text class="tag" x="800" y="113">requirements · architecture · judgment · sign-off</text>

  <!-- hub -->
  <rect x="610" y="330" width="380" height="140" rx="14" fill="rgba(255,106,43,.12)" stroke="#ff6a2b" stroke-width="2"/>
  <text x="800" y="388" style="font-family:Marcellus;font-size:29px;fill:#ecebe7;text-anchor:middle">Design Specification</text>
  <text class="tag" x="800" y="418" style="fill:#ff8a57">parameters · formulas · uncertainty · checks</text>
  <text class="tag" x="800" y="440" style="fill:#ff8a57">every value traceable to its source</text>

  <!-- engineer <-> hub -->
  <path d="M800 144 V322" stroke="#ecebe7" stroke-width="2" fill="none" marker-start="url(#aw)" marker-end="url(#aw)"/>
  <text class="e" x="816" y="238">decides, reads, edits</text>

  <!-- left: today -->
  <text class="lab" x="230" y="212">IN MY WORKFLOW TODAY</text>
  <rect class="n" x="70" y="234" width="320" height="86" rx="12"/>
  <text class="t" x="230" y="272">Research Agent</text><text class="tag" x="230" y="298">papers, products, patents</text>
  <rect class="n" x="70" y="357" width="320" height="86" rx="12"/>
  <text class="t" x="230" y="395">Modeling Agent</text><text class="tag" x="230" y="421">physics models and calculators</text>
  <rect class="n" x="70" y="480" width="320" height="86" rx="12"/>
  <text class="t" x="230" y="518">Review Agent</text><text class="tag" x="230" y="544">a second model checks the first</text>
  <g class="l" marker-end="url(#a)" marker-start="url(#a)">
    <path d="M398 277 C 500 277, 520 370, 602 370"/>
    <path d="M398 400 H602"/>
    <path d="M398 523 C 500 523, 520 430, 602 430"/>
  </g>

  <!-- right: emerging -->
  <text class="lab" x="1370" y="212">EMERGING</text>
  <rect class="nd" x="1210" y="234" width="320" height="86" rx="12"/>
  <text class="t" x="1370" y="272">CAD Agent</text><text class="tag" x="1370" y="298">geometry driven by the sheet</text>
  <rect class="nd" x="1210" y="357" width="320" height="86" rx="12"/>
  <text class="t" x="1370" y="395">Simulation Agent</text><text class="tag" x="1370" y="421">FEA and CFD on that geometry</text>
  <rect class="nd" x="1210" y="480" width="320" height="86" rx="12"/>
  <text class="t" x="1370" y="518">Test Agent</text><text class="tag" x="1370" y="544">reduces data, recalibrates models</text>
  <g class="l" stroke-dasharray="7 6" marker-end="url(#a)" marker-start="url(#a)">
    <path d="M1202 277 C 1100 277, 1080 370, 998 370"/>
    <path d="M1202 400 H998"/>
    <path d="M1202 523 C 1100 523, 1080 430, 998 430"/>
  </g>

  <!-- hardware -->
  <rect x="540" y="676" width="520" height="92" rx="12" fill="#111216" stroke="rgba(255,255,255,.22)" stroke-width="1.5"/>
  <text class="t" x="800" y="716">Hardware</text>
  <text class="tag" x="800" y="743">prototype · instruments · test rig</text>
  <path d="M800 478 V668" stroke="#6c7079" stroke-width="1.5" fill="none" marker-end="url(#a)"/>
  <text class="e" x="816" y="580">build</text>
  <path d="M1068 722 H1352 a18 18 0 0 0 18 -18 V574" stroke="#ff6a2b" stroke-width="2" fill="none" marker-end="url(#ao)"/>
  <text class="e" x="1190" y="708" style="fill:#ff8a57">measurements</text>
</svg>
