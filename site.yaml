hero:
  credentials:                    # small line above your name
    - MIT Mechanical Engineering graduate student
    - NSF Graduate Research Fellow
    - Georgia Tech Alumn
  summary: >-                     # one paragraph under your name
    I research medical soft robotics, developing solutions to the energy limits of
    devices that must work in highly constrained environments, and I specialize in
    novel robotic mechanisms and precision devices designed for manufacturing at scale.
    I'm drawn to complicated problems at the boundaries of mechanical engineering, and
    my goal is to question the conventional limits of robotics to build technology that
    augments how we interact with the world and with our own biology.

