# ─────────────────────────────────────────────────────────────────────────────
#  SITE SETTINGS
#  Your name, contact details, photo, links and logos. The home page wording
#  (summary, projects intro, experience, publications, contact line) lives in
#  the home/ folder as Markdown files. The full résumé PDF lives in files/.
#  Indentation matters in YAML: keep the two-space indents, and wrap text
#  containing a colon in "quotes".
# ─────────────────────────────────────────────────────────────────────────────

name: Samuel Kirschner
short_name: Kirschner            # bolded in publication author lists
role: Mechanical Engineer
location: Cambridge, MA
email: samkir@mit.edu
url: https://samkir.com          # the live site address (used for link previews)
base: /                          # leave as / unless the site moves into a subfolder

resume: files/Samuel_Kirschner_Resume.pdf
headshot: files/headshot.jpg
headshot_position: 50% 22%       # which part of the photo stays in frame (x% y%)
headshot_mobile: files/headshot-circle.jpg   # square close crop for the small circle on phones

links:
  linkedin: https://linkedin.com/in/samuelkirschner
  scholar: https://scholar.google.com/citations?user=mxpmhYYAAAAJ&hl=en
  # github: https://github.com/KSam37

# Shown as a quiet row under the summary. Add a logo (white or single-colour SVG/PNG
# in files/logos/) to replace the text, e.g.  logo: files/logos/mit.svg
affiliations:                     # height = display height in px, tuned for equal visual weight
  - name: MIT
    logo: files/logos/mit.png
    height: 34
  - name: Georgia Tech
    logo: files/logos/georgia-tech.png
    height: 46
  - name: NASA
    logo: files/logos/nasa.png
    height: 56

